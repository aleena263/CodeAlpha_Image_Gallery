<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Assets/images/faviicon.jpg">
    <title>Gallery Images</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Explore Beautiful Images With A Modern And Responsive Gallery Design.</p>
    </header>

    <main>

        <section class="filter-buttons">
            <button onclick="all">All</button>
            <button onclick="nature">Nature</button>
            <button onclick="city">City</button>
            <button onclick="animal">Animal</button>
        </section>


        <section class="gallery">
            <div class="gallery_item city">
                <img src="Assets/images/city-1.jpg" alt="">
                  <div class="caption">Modern Skyline</div>
            </div>
            <div class="gallery_item nature">
                <img src="Assets/images/nature-1.jpg" alt="">
                <div class="caption">Green Forest</div>
            </div>
            <div class="gallery_item animal">
                <img src="Assets/images/cat.jpg" alt="">
                <div class="caption">Majestic Cat</div>
            </div>
            <div class="gallery_item city">
                <img src="Assets/images/city-2.jpg" alt="">
                <div class="caption">City Lights</div>
            </div>
            <div class="gallery_item nature">
                <img src="Assets/images/nature-2.jpg" alt="">
                <div class="caption">Mountain View</div>
            </div>
            <div class="gallery_item city">
                <img src="Assets/images/city-3.jpg" alt="">
                <div class="caption">Urban Streets</div>
            </div>
            <div class="gallery_item city">
                <img src="Assets/images/city-4.jpg" alt="">
                <div class="caption">Night Downtown</div>
            </div>
            <div class="gallery_item animal">
                <img src="Assets/images/horse-1.jpg" alt="">
                <div class="caption">Wild Horse</div>
            </div>
            <div class="gallery_item nature">
                <img src="Assets/images/nature-3.jpg" alt="">
                <div class="caption">Sunset Valley</div>
            </div>
            <div class="gallery_item animal">
                <img src="Assets/images/parrot.jpg" alt="">
                <div class="caption">Green Parrot</div>
            </div>
            <div class="gallery_item nature">
                <img src="Assets/images/nature-4.jpg" alt="">
                <div class="caption">River Breeze</div>
            </div>
            <div class="gallery_item animal">
                <img src="Assets/images/rabbit.jpg" alt="">
                <div class="caption">Cute Rabbit</div>
            </div>
        </section>

        <section>
            <div class="lightbox" id="lightbox">
                <span class="close" id="close">&times;</span>
                <button id="previouse">&#10094;</button>
                <img class="lightbox-img" src="" alt="">
                <button id="next">&#10095;</button>
            </div>
        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
